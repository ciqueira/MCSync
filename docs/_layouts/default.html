<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171717">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MCSync">
  <meta property="og:title" content="{{ page.title }} · MCSync">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
  <meta property="og:image" content="https://sync.mcnexus.app/assets/brand/mcsync-icon-light.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:card" content="summary">
  <title>{{ page.title }} · MCSync</title>
  <link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/mcsync-symbol.svg">
  <link rel="apple-touch-icon" href="/assets/brand/mcsync-icon-light.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="MCSync home">
        <img class="brand-symbol" src="/assets/brand/mcsync-symbol.svg" alt="" aria-hidden="true">
        <span class="brand-name">MCSync</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="https://github.com/ciqueira/MCSync/releases">Download</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </div>
  </header>
  <main id="content" class="shell document">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>MCSync · macOS transfer utility by <a href="https://mcnexus.app">MCNexus</a></p>
      <p><a href="mailto:sync@mcnexus.app">sync@mcnexus.app</a></p>
    </div>
  </footer>
</body>
</html>
